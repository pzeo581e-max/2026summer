<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヒーロー｜100年目の答礌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#1D3557;--indigo2:#165E83;--kinari:#F7F3E8;--akane:#C1502E;--gold:#D9A441;--ink:#2C2C2B;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--kinari);font-family:'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif;color:var(--kinari);}
.hero{background:linear-gradient(175deg,#12263F 0%,var(--indigo) 45%,var(--indigo2) 100%);position:relative;overflow:hidden;}
.hero-inner{max-width:880px;margin:0 auto;padding:46px 24px 92px;text-align:center;}
.dove{width:54px;height:auto;margin-bottom:10px;}
.badge{display:inline-block;border:1px solid rgba(247,243,232,.55);border-radius:999px;padding:6px 18px;font-size:12.5px;letter-spacing:.22em;margin-bottom:20px;color:rgba(247,243,232,.92);}
h1{font-family:'Shippori Mincho','Noto Serif CJK JP',serif;font-weight:800;font-size:clamp(19px,3.1vw,34px);line-height:1.75;letter-spacing:.06em;}
@media (max-width:640px){h1{font-size:clamp(19px,4.9vw,24px);letter-spacing:.03em;}.hero-inner{padding:36px 20px 72px;}.lead{font-size:16px;line-height:1.85;}}
h1 .gold{color:var(--gold);}
.lead{margin:18px auto 26px;max-width:600px;font-size:14.5px;line-height:2;color:rgba(247,243,232,.85);}
.cta{display:inline-block;background:var(--akane);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:15px 44px;border-radius:8px;letter-spacing:.12em;box-shadow:0 6px 18px rgba(0,0,0,.28);transition:transform .25s,box-shadow .25s;}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.34);}
.note{margin-top:12px;font-size:12px;color:rgba(247,243,232,.6);letter-spacing:.08em;}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:56px;display:block;}
.fade{opacity:0;transform:translateY(12px);transition:opacity .9s ease,transform .9s ease;}
.fade.visible{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){.fade{opacity:1;transform:none;transition:none;}.cta{transition:none;}}
</style>
</head>
<body>
<section class="hero">
  <div class="hero-inner">
    <svg class="dove fade" viewBox="0 0 64 48" aria-hidden="true"><path d="M50 10c-8-6-20-4-26 4-5-3-12-3-17 1 5 1 8 3 10 6-6 8-4 18 3 23 1-7 4-13 9-17 6-5 14-6 21-3-2-5-2-9 0-14z" fill="#F7F3E8"/><path d="M44 12l8-5-3 8z" fill="#D9A441"/></svg>
    <div class="badge fade">2026夏プロジェクト｜100年目の答礌</div>
    <h1 class="fade">100年前の友情に、<br><span class="gold">いまの返事を。</span></h1>
    <p class="lead fade">アメリカから日本へ贈られた「青い目の人形」。その答礌として岡山から「ミス岡山」がアメリカへ渡りました。100年後のいま、岡山の学生が自分の腳で日本を縦断し、ノースダコタに眠るミス岡山を訪ねます。</p>
    <div class="fade">
      <a class="cta" href="https://camp-fire.jp/projects/959462/view?utm_campaign=cp_po_share_c_msg_mypage_projects_show" target="_blank" rel="noopener">この挑戦を応援する</a>
      <div class="note">クラウドファンディング詳細ページへ</div>
    </div>
  </div>
  <svg class="wave" viewBox="0 0 1440 56" preserveAspectRatio="none" aria-hidden="true"><path d="M0,32 C240,60 480,4 720,24 C960,44 1200,10 1440,30 L1440,56 L0,56 Z" fill="#F7F3E8"/></svg>
</section>
<script>
(function(){
  var els=document.querySelectorAll('.fade');
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){els.forEach(function(e){e.classList.add('visible');});return;}
  els.forEach(function(e,i){setTimeout(function(){e.classList.add('visible');},150+i*180);});
  setTimeout(function(){els.forEach(function(e){e.classList.add('visible');});},1600);
})();
</script>
</body>
</html>
