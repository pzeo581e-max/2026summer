<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物語タイムライン｜1927年からつづく物語</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#1D3557;--kinari:#F7F3E8;--akane:#C1502E;--ink:#2C2C2B;--sub:#6E6A61;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--kinari);color:var(--ink);font-family:'Zen Kaku Gothic New','Noto Sans CJK JP',sans-serif;}
.wrap{max-width:720px;margin:0 auto;padding:40px 24px 48px;}
@media (max-width:480px){.wrap{padding:28px 18px 36px;}h2{font-size:clamp(18px,5vw,22px);margin-bottom:24px;}.tl{padding-left:28px;}.item{padding-bottom:24px;}.item h3{font-size:16px;}.item p{font-size:16px;line-height:1.8;}}
.label{text-align:center;color:var(--akane);font-size:12px;font-weight:700;letter-spacing:.34em;margin-bottom:8px;}
h2{text-align:center;font-family:'Shippori Mincho','Noto Serif CJK JP',serif;font-weight:800;font-size:clamp(20px,3vw,27px);letter-spacing:.08em;color:var(--indigo);margin-bottom:34px;}
.tl{position:relative;padding-left:34px;}
.tl::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:#D8D2C0;}
.item{position:relative;padding:0 0 30px 6px;}
.item:last-child{padding-bottom:0;}
.item::before{content:"";position:absolute;left:-32px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--kinari);border:3px solid var(--akane);}
.item h3{font-family:'Shippori Mincho','Noto Serif CJK JP',serif;font-size:17px;letter-spacing:.1em;color:var(--indigo);margin-bottom:6px;}
.item p{font-size:14px;line-height:1.95;color:var(--sub);}
body.anim .item{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease;}
body.anim .item.visible{opacity:1;transform:none;}
@media (prefers-reduced-motion:reduce){body.anim .item{opacity:1;transform:none;transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="label">STORY</div>
  <h2>1927年からつづく物語</h2>
  <div class="tl">
    <div class="item"><h3>1927 春</h3><p>世界平和を願い、アメリカから約1万2千体の「青い目の人形」が日本の子どもたちへ贈られる。</p></div>
    <div class="item"><h3>1927 冬</h3><p>答礼として日本から58体の「答礼人形」が渡米。岡山からは「ミス岡山」が海を渡り、いまもノースダコタ州立大学（NDSU）に保管されている。</p></div>
    <div class="item"><h3>2026 夏</h3><p>岡山の大学生が佐多岬から宗谷岬まで約2,800kmを自分の脚で縦断。道中で出会う人々から“いまの声”を集める。</p></div>
    <div class="item"><h3>2026 秋</h3><p>集めた声を携えてアメリカ・ノースダコタへ。ミス岡山と対面し、100年前の友情に“いまの返事”を届ける。</p></div>
  </div>
</div>
<script>
(function(){
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced||!('IntersectionObserver' in window))return;
  document.body.classList.add('anim');
  var els=document.querySelectorAll('.item');
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});
  },{threshold:0.25});
  els.forEach(function(el){io.observe(el);});
  setTimeout(function(){els.forEach(function(el){el.classList.add('visible');});},1600);
})();
</script>
</body>
</html>
