<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173255"><title>日本縦断｜旅の再生マップ</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#dceaf4,#f4eddd);color:#332e28;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif}.app{max-width:1120px;margin:auto;padding:14px}.hero,.card{border:3px solid #142845;border-radius:18px;overflow:hidden;box-shadow:0 8px 22px #263b5128}.hero{padding:20px;background:#234571;color:#fff}.hero small{color:#f4d46a;font-weight:900}.hero h1{margin:6px 0;font-size:clamp(25px,5vw,40px)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{padding:7px 10px;border:2px solid #ffffffaa;border-radius:999px;font-weight:800;font-size:12px}.notice{margin:12px 0;padding:13px;border:2px solid #b78322;border-radius:14px;background:#fff3bf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{text-align:center;padding:11px 4px;border:2px solid #234571;border-radius:13px;background:#fff}.stat small{display:block;color:#6c645b;font-weight:800}.stat strong{font:900 clamp(18px,4vw,25px) monospace;color:#234571}.progress{height:13px;margin:8px 0 12px;border:2px solid #234571;border-radius:99px;background:#fff}.progress div{height:100%;background:#c1443a}.layout{display:grid;gap:12px}.card{background:#fffaf0}.head{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#142845;color:#fff;font-weight:900}.toolbar{display:flex;justify-content:space-between;padding:8px;background:#e7edf3;border-bottom:2px solid #234571}button{min-height:44px;border:2px solid #234571;border-radius:9px;background:white;color:#234571;font-weight:900}.map{position:relative;height:min(69vh,680px);min-height:440px;overflow:hidden;background:#eee5d3}.stage{position:absolute;inset:0;display:grid;place-items:center;transform:translate(var(--x,0),var(--y,0)) scale(var(--s,1));transition:.35s}.stage img{height:100%;width:auto}.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:9px 13px;border:2px solid white;border-radius:999px;background:#142845eb;color:#fff;font-weight:900;opacity:0;transition:.2s}.toast.on{opacity:1}.logs{display:grid;gap:9px;padding:12px;max-height:690px;overflow:auto}.log{padding:10px;border:2px solid #234571;border-radius:12px;background:#fff}.logtop{display:flex;justify-content:space-between;align-items:center;color:#234571;font-weight:900}.log h2{margin:5px 0 7px;font-size:15px}.nums{display:flex;gap:10px;flex-wrap:wrap;font:800 12px monospace;color:#6c645b}@media(min-width:850px){.layout{grid-template-columns:1.55fr .65fr}.map{height:690px}.side{position:sticky;top:12px}}@media(max-width:520px){.app{padding:8px}.hero{padding:16px}.stats{grid-template-columns:1fr}.map{min-height:480px}.toolbar{gap:8px;flex-wrap:wrap}.logs{max-height:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="app"><header class="hero"><small>SATA CAPE → SOYA CAPE / ABOUT 3,000 KM</small><h1>旅の再生マップ</h1><p>予定ルートを眺め、公開された実走記録を日付順にたどるためのマップです。</p><div class="chips"><span class="chip">🚴 Section2 走行中</span><span class="chip">🗺️ 画像基準日 8/7</span></div></header><div class="notice"><b>最新状況：</b>8/11に佐多岬をスタート。Day25（9/5・美深）まで公開中<br><small>最新見込みは文字情報で表示し、ルート画像には焼き込みません。</small></div><section class="stats"><div class="stat"><small>累計距離</small><strong>2970.62 km</strong></div><div class="stat"><small>公開走行日</small><strong>25 日</strong></div><div class="stat"><small>全体進捗</small><strong>99.0%</strong></div></section><div class="progress"><div style="width:99.0%"></div></div><div class="layout"><section class="card"><div class="head"><span>🗾 日本縦断ルート</span><small>予定ルート表示</small></div><div class="toolbar"><span><button id="minus">−</button> <button id="fit">全体</button> <button id="plus">＋</button></span><button id="play">▶ 旅を再生</button></div><div class="map" id="map"><div class="stage" id="stage"><img id="route" alt="8月7日基準の日本縦断予定ルート"></div><div class="toast" id="toast">地図を読み込み中</div></div></section><aside class="card side"><div class="head"><span>📍 公開された旅の記録</span><small>25件</small></div><div class="logs" id="logs"></div></aside></div></main><script>const D=[['Day1','08/11','鹿屋（鹿児島県鹿屋市）','157.70','1,876'],['Day2','08/12','宮崎（宮崎県宮崎市）','102.77','814'],['Day3','08/13','佐伯（大分県佐伯市）','177.83','1,230'],['Day4','08/14','中津（大分県中津市）','123.97','948'],['Day5','08/15','宇部（山口県宇部市）','122.44','505'],['Day6','08/16','光（山口県光市）','108.17','710'],['Day7','08/17','東広島市（広島県東広島市）','131.85','569'],['Day8','08/18','岡山（岡山県岡山市）','145.80','543'],['Day9','08/20','神戸（兵庫県神戸市）','153.99','537'],['Day10','08/21','大津（滋賀県大津市）','87.60','490'],['Day11','08/22','越前市（福井県越前市）','136.43','915'],['Day12','08/23','金沢（石川県金沢市）','117.56','358'],['Day13','08/24','富山（富山県富山市）','86.60','250'],['Day14','08/25','糸魚川（新潟県糸魚川市）','92.67','376'],['Day15','08/26','出雲崎町（新潟県三島郡出雲崎町）','102.97','578'],['Day16','08/27','新潟市（新潟県新潟市）','63.21','151'],['Day17','08/28','鶴岡市（山形県鶴岡市）','141.00','537'],['Day18','08/29','秋田（秋田県秋田市）','126.31','622'],['Day19','08/30','十和田湖（青森県十和田市）','148.94','1,359'],['Day20','08/31','青森フェリーターミナル','85.92','650'],['Day21','09/01','長万部駅','107.61','411'],['Day22','09/02','登別駅','100.83','800'],['Day23','09/03','札幌市','109.55','296'],['Day24','09/04','旭川市','133.76','343'],['Day25','09/05','美深町','105.14','409']];const $=s=>document.querySelector(s),stage=$('#stage'),toast=$('#toast');$('#logs').innerHTML=D.map(d=>`<article class="log"><div class="logtop"><b>${d[0]}</b><small>${d[1]}</small></div><h2>${d[2]}</h2><div class="nums"><span>🚴 ${d[3]} km</span><span>⛰ ${d[4]} m</span></div></article>`).join('');let v={s:1,x:0,y:0},timer;function msg(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1500)}function draw(){stage.style.setProperty('--s',v.s);stage.style.setProperty('--x',v.x+'px');stage.style.setProperty('--y',v.y+'px')}function view(s,x=0,y=0){v={s:Math.max(.75,Math.min(2.5,s)),x,y};draw()}fetch('journey-map-data/map.b64?v=202608081').then(r=>r.text()).then(t=>{$('#route').src='data:image/webp;base64,'+t.trim();msg('8/7基準ルートを読み込みました')}).catch(()=>msg('地図データを読み込めませんでした'));$('#plus').onclick=()=>view(v.s+.22,v.x,v.y);$('#minus').onclick=()=>view(v.s-.22,v.x,v.y);$('#fit').onclick=()=>{clearInterval(timer);timer=0;view(1);$('#play').textContent='▶ 旅を再生'};const tour=[['START｜佐多岬',1.8,110,-190],...D.map((d,i)=>[d[0]+'｜'+d[2].split('（')[0],Math.min(1.8,1.4+i*.016),90-i*7,-170+i*15]),['北海道・宗谷岬',1.75,-85,190],['佐多岬 → 宗谷岬',1,0,0]];$('#play').onclick=()=>{if(timer){clearInterval(timer);timer=0;$('#play').textContent='▶ 旅を再生';return}let i=0;$('#play').textContent='■ 停止';let go=()=>{let p=tour[i++];view(p[1],p[2],p[3]);msg(p[0]);if(i===tour.length){clearInterval(timer);timer=0;$('#play').textContent='▶ 旅を再生'}};go();timer=setInterval(go,1600)};draw();</script></body></html>
