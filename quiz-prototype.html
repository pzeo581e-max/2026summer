<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本縦断 ご当地クイズ</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#9bdcff;color:#18212f}.app{max-width:900px;margin:auto;padding:14px}.shell{border:4px solid #183059;border-radius:18px;background:#fffdf5;overflow:hidden;box-shadow:0 7px #1b2a45}.head{padding:16px;background:#183059;color:#fff}h1{margin:0;font-size:clamp(22px,5vw,34px)}.score,.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#ffd447;font-weight:900}.tab,button{border:3px solid #183059;border-radius:10px;background:#fff;padding:10px;font-weight:900}.tab.on{background:#e84855;color:#fff}.panel{display:none;padding:14px}.panel.on{display:block}.card{border:3px solid #183059;border-radius:14px;padding:14px;background:#fff}.badge{display:inline-block;margin:3px;padding:5px 8px;border:2px solid #183059;border-radius:7px;background:#ffd447;font-weight:900}.area{background:#276fbf;color:#fff}.q{font-size:22px;font-weight:900;line-height:1.6}.choices{display:grid;gap:10px}.choice{text-align:left}.ok{background:#c8f2ce}.ng{background:#ffd2d5}.fb{display:none;margin-top:12px;padding:12px;border:3px solid #183059;border-radius:10px;background:#eef8ff;line-height:1.7}.fb.on{display:block}.grid{display:grid;gap:8px}.item{text-align:left;display:flex;justify-content:space-between;gap:8px}.locked{opacity:.62;background:#e7edf3}.map{height:560px;background:#8bd3ff;border:3px solid #183059;border-radius:14px;overflow:auto}.note{margin-top:10px;font-size:12px;line-height:1.6}@media(min-width:700px){.choices{grid-template-columns:1fr 1fr}.layout{display:grid;grid-template-columns:1fr 1fr;gap:12px}}</style></head><body><main class="app"><section class="shell"><header class="head"><small>SATA → SOYA / 3,000 KM</small><h1>🚲 日本縦断 ご当地クイズ</h1></header><div class="score" id="score"></div><nav class="tabs"><button class="tab on" data-p="quiz">🎲 クイズ</button><button class="tab" data-p="doll">🪆 人形ボーナス</button><button class="tab" data-p="map">🗾 日本地図</button></nav><section class="panel on" id="quiz"><article class="card"><div><span class="badge" id="no"></span><span class="badge area" id="area"></span><span class="badge" id="cat"></span></div><div class="q" id="q"></div><div class="choices" id="choices"></div><div class="fb" id="fb"><b id="ft"></b><div id="ex"></div><button onclick="retry()">↻ もう一度挑戦</button><button onclick="tab('map')">🗾 日本地図を見る</button></div></article><p class="note">公開済みの到達地点「東広島」までの問題を解放しました。未来の問題は地域名だけを表示し、本文・選択肢・正解・解説はHTML内に含めていません。</p></section><section class="panel" id="doll"><div class="grid" id="dolllist"></div></section><section class="panel" id="map"><div class="layout"><div class="map"><svg viewBox="0 0 400 620" width="100%" height="620"><path d="M72 458L107 420 126 374 150 330 181 291 216 253 254 226 293 211 323 187 352 140 366 118 378 84 388 52 394 18 382 4 366 12 356 40 348 76 352 110 368 155 342 202 310 226 277 239 239 266 207 286 177 319 152 361 132 401 96 470Z" fill="#71bd66" stroke="#205a38" stroke-width="4"/><path d="M78 449C105 422 118 399 126 374C138 349 149 328 162 307C176 288 193 270 212 254C232 239 251 228 274 219C292 213 306 210 319 211C332 206 340 200 347 194C356 185 361 177 366 168C371 158 374 149 376 138C378 125 380 112 382 102C384 90 386 81 387 72C384 66 377 63 371 60C367 56 363 53 358 48C353 43 349 40 345 36C340 32 336 29 331 25C326 21 321 17 316 13C313 10 311 7 310 4" fill="none" stroke="#fff" stroke-width="8"/><g id="nodes"></g></svg></div><div class="grid" id="list"></div></div></section></section></main><script>const U=[{id:'main-01',o:1,a:'佐多岬・大隅半島',c:'地理',q:'佐多岬は、次のうちどの「最南端」でしょう？',x:['日本列島全体の最南端','日本本土の最南端','鹿児島県の有人島最南端','西日本の最東端'],z:1,e:'佐多岬は日本本土最南端。北緯31度線付近にあり、この日本縦断のスタート地点です。',px:78,py:449},{id:'main-02',o:2,a:'鹿屋・日南・青島・宮崎',c:'観光・自然',q:'宮崎・青島を囲むように広がる奇岩群「鬼の洗濯板」。国の天然記念物にも指定されるこの地形は、どのようにしてできた？',x:['川が運んだ土砂が板状に固まった','火山の溶岩が波で削られてできた','海中で積み重なった地層が隆起し、波の侵食で硬い岩だけが残った','人工的に造られた防波堤の跡'],z:2,e:'正式名称は「青島の隆起海床と奇形波蝕痕」。硬い砂岩と軟らかい泥岩の地層が隆起し、波の侵食で硬い岩だけが残りました。',px:105,py:414},{id:'main-03',o:3,a:'宮崎・延岡・宗太郎・佐伯',c:'地理',q:'大分県佐伯市は、面積の点で九州の市町村の中でどのような特徴を持つ？',x:['九州の市の中で最も面積が広い','九州で唯一海に面していない市','九州最小の面積の市','九州で人口密度が最も高い市'],z:0,e:'佐伯市は九州の市町村の中で最も広い面積を持ちます。',px:126,py:374},{id:'main-04',o:4,a:'佐伯・大分・別府・行橋',c:'観光・自然',q:'大分県の別府温泉が「日本一」を誇る、2つの組み合わせは？',x:['泉質の種類数と温泉宿の数','源泉数と湧出量','露天風呂の数と入浴客数','温泉の歴史の長さと湯の温度'],z:1,e:'別府温泉は源泉数・湧出量ともに日本一を誇る温泉地です。',px:145,py:338},{id:'main-05',o:5,a:'行橋・北九州・門司・関門海峡・下関',c:'産業・交通',q:'自転車で関門トンネル人道を通るときの正しい方法は？',x:['そのまま自転車で走る','自転車を押して歩く','輪行袋に入れなければならない','自転車は通行できない'],z:1,e:'自転車は押して歩けば通行でき、途中には福岡県と山口県の海底県境があります。',px:168,py:302},{id:'main-06',o:6,a:'光市内',c:'歴史',q:'山口県光市出身で、日本の初代内閣総理大臣を務めた人物は？',x:['大久保利通','伊藤博文','山縣有朋','井上馨'],z:1,e:'伊藤博文は現在の光市束荷で生まれ、日本の初代内閣総理大臣を務めました。',px:193,py:271},{id:'main-07',o:7,a:'光・岩国・広島・尾道',c:'歴史',q:'広島市の原爆ドームは、1915年に別の施設として完成しました。もともとは何の施設？',x:['広島県物産陳列館','広島県庁舎','広島駅の駅舎','市民病院'],z:0,e:'正解は広島県物産陳列館。チェコ人建築家ヤン・レツルの設計で、県内の物産の展示・即売や博覧会の会場として使われていました。被爆で全焼しながらも骨格が残り、現在は核兵器の惨禍を伝える平和記念碑として世界遺産に登録されています。',px:218,py:250}],F=[['main-08',8,'尾道・福山・倉敷・岡山',251,229],['main-09',9,'岡山・姫路・明石・神戸',284,218],['main-10',10,'神戸市内',319,211],['main-11',11,'神戸・京都・大津・湖西',330,203],['main-12',12,'真野・敦賀・鯖江・福井',343,196],['main-13',13,'福井・加賀・金沢',353,186],['main-14',14,'金沢・富山・浜黒崎・糸魚川',360,175],['main-15',15,'能生・長岡・和島・新潟',367,165],['main-16',16,'新潟・新発田・胎内・村上',375,138],['main-17',17,'鶴岡・酒田・象潟',379,120],['main-18',18,'由利本荘・秋田・潟上',382,103],['main-19',19,'能代・八峰・深浦（白神山地西麓）',384,90],['main-20',20,'深浦・津軽・青森・函館',386,72],['main-21',21,'森・八雲・国縫',372,61],['main-22',22,'長万部・洞爺湖・壮瞥（昭和新山）',366,51],['main-23',23,'白老・苫小牧・千歳・札幌',356,44],['main-24',24,'札幌・江別・岩見沢',346,37],['main-25',25,'深川・旭川・比布',336,29],['main-26',26,'士別・名寄・美深・音威子府',326,21],['main-27',27,'中川・幌延・豊富',317,13],['main-28',28,'総集編（ゴール：宗谷岬）',310,4]].map(r=>({id:r[0],o:r[1],a:r[2],px:r[3],py:r[4],l:1}));const D=[['doll-01',1,'大阪（大阪歴史博物館）'],['doll-02',2,'大津（大津市歴史博物館）'],['doll-03',3,'白山（白山市立博物館）'],['doll-04',4,'札幌（札幌市時計台・簾舞小学校）'],['doll-05',5,'美唄（美唄市郷土史料館）']].map(r=>({id:r[0],n:r[1],a:r[2],l:1}));const K='ride-quiz-progress-v1';let P=JSON.parse(localStorage.getItem(K)||'{}'),C=U.at(-1);const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function save(){localStorage.setItem(K,JSON.stringify(P))}function tab(id){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.p===id));$$('.panel').forEach(p=>p.classList.toggle('on',p.id===id));}$$('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.p));function render(q){C=q;$('#no').textContent='第'+q.o+'問';$('#area').textContent=q.a;$('#cat').textContent=q.c;$('#q').textContent=q.q;$('#choices').innerHTML='';q.x.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.innerHTML='<b>'+String.fromCharCode(65+i)+'</b> '+v;b.onclick=()=>ans(i,b);$('#choices').append(b)});$('#fb').className='fb';tab('quiz')}function ans(i,b){$$('.choice').forEach(x=>x.disabled=1);if(i===C.z){b.classList.add('ok');P[C.id]=1;$('#ft').textContent='せいかい！'}else{$('#ft').textContent='ざんねん！';b.classList.add('ng')}$('#ex').textContent=C.e;$('#fb').className='fb on';save();score()}function retry(){render(C)}function score(){let n=U.filter(q=>P[q.id]).length;$('#score').textContent='正解済み '+n+'問／解放済み '+U.length+'問'}function pick(s){if(s.l)return alert('🔒 未来の問題です：'+s.a);render(U.find(q=>q.id===s.id))}function build(){[...U,...F].forEach(s=>{let b=document.createElement('button');b.className='item '+(s.l?'locked':'');b.innerHTML='<b>'+(s.o?'第'+s.o+'問':'')+'</b><span>'+s.a+'</span><span>'+(s.l?'🔒':'挑戦可')+'</span>';b.onclick=()=>pick(s);$('#list').append(b);let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform','translate('+s.px+' '+s.py+')');g.innerHTML='<circle r="13" fill="'+(s.l?'#9ba8b8':'#ffd447')+'" stroke="#183059" stroke-width="3"/><text y="4" text-anchor="middle" font-size="10" font-weight="900">'+(s.l?'🔒':s.o)+'</text>';g.onclick=()=>pick(s);$('#nodes').append(g)});D.forEach(s=>{let b=document.createElement('button');b.className='item locked';b.innerHTML='<b>🪆 その'+s.n+'</b><span>'+s.a+'</span><span>🔒 未到達</span>';$('#dolllist').append(b)});render(C);score()}build();</script></body></html>
