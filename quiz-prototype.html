text-align:left}.locked{background:#e2e7ec;color:#667085}svg{width:100%;height:560px;background:#8bd3ff}.land{fill:#71bd66;stroke:#205a38;stroke-width:3}.route{fill:none;stroke:white;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.dash{fill:none;stroke:#e84855;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round}.node circle{fill:#ffd447;stroke:#183059;stroke-width:3}.node text{font:900 10px monospace;text-anchor:middle;dominant-baseline:central}.conf{position:fixed;top:-20px;width:10px;height:14px;background:#e84855;animation:fall 2s forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(min-width:700px){.choices{grid-template-columns:1fr 1fr}.mapgrid{display:grid;grid-template-columns:1.1fr .9fr}}</style></head><body><main class="app"><section class="box"><header class="head"><small>SATA → SOYA / 3,000 KM</small><h1>🚲 日本縦断 ご当地クイズ</h1></header><div class="score">QUIZ<div class="bar"><div id="fill" class="fill"></div></div><span id="score"></span></div><nav class="tabs"><button class="on" data-p="quiz">🎲 クイズ</button><button data-p="doll">🪆 人形ボーナス</button><button data-p="map">🗾 日本地図</button></nav><section id="quiz" class="panel on"><div><span id="no" class="badge"></span><span id="area" class="badge area"></span><span id="cat" class="badge"></span></div><h2 id="q" class="q"></h2><div id="choices" class="choices"></div><div id="fb" class="fb"><b id="ft"></b><p id="ex"></p></div><button id="retry" class="btn">↻ もう一度</button><button id="mapbtn" class="btn">🗾 地図へ</button><button id="portal" class="btn">🚲 ポータルへ戻る</button><p>未来の問題は地域名だけの鍵付き表示です。回答記録は同じ端末・ブラウザ内に保存されます。</p></section><section id="doll" class="panel"><h2>🪆 人形ボーナス</h2><div id="dolllist" class="list"></div></section><section id="map" class="panel"><div class="mapgrid"><svg viewBox="0 0 400 620"><path class="land" d="M68 609L80 600 94 594 88 573 94 547 100 532 98 524 95 504 92 512 74 495 60 502 50 514 39 517 44 527 48 541 59 539 60 556 61 562 59 598Z"/> ','歴史','倉敷は江戸時代どんな地として栄えた？',['宿場町','鉱山町','幕府直轄の物資集散地','城下町'],2,'倉敷は天領として物資の集積地になりました。',153,466],['main-09',9,'岡山・姫路・明石・神戸','名産・グルメ','明石焼きの特徴的な食べ方は？',['だし汁につける','ソースをかける','しょうゆと七味','塩をふる'],0,'明石焼きはだし汁につけて食べます。',186,465],['main-10',10,'神戸市内','歴史','神戸ルミナリエが始まったきっかけは？',['開港記念','震災犠牲者への鎮魂と復興への願い','観光誘致','姉妹都市記念'],1,'阪神・淡路大震災の鎮魂と復興への願いが込められています。',191,452],['main-11',11,'神戸・京都・大津・湖西','地理','琵琶湖は大きさ以外の点でも日本一です。それは？',['最も深い','最も古い湖（古代湖）','透明度が最も高い','標高が最も高い'],1,'琵琶湖はおよそ400万年の歴史を持つ日本最古の湖です。',204,445]].map(a=>({id:a[0],o:a[1],a:a[2],c:a[3],q:a[4],x:a[5],z:a[6],e:a[7],px:a[8],py:a[9]}));const F=[['main-12',12,'真野・敦賀・鯖江・福井',213,411],['main-13',13,'福井・加賀・金沢',224,392],['main-14',14,'金沢・富山・浜黒崎・糸魚川',255,373],['main-15',15,'能生・長岡・和島・新潟',286,339],['main-16',16,'新潟・新発田・胎内・村上',297,327],['main-17',17,'鶴岡・酒田・象潟',307,307],['main-18',18,'由利本荘・秋田・潟上',314,269],['main-19',19,'能代・八峰・深浦',309,232],['main-20',20,'深浦・津軽・青森・函館',330,189],['main-21',21,'森・八雲・国縫',319,170],['main-22',22,'長万部・洞爺湖・壮瞥',338,158],['main-23',23,'白老・苫小牧・千歳・札幌',346,138],['main-24',24,'札幌・江別・岩見沢',362,128],['main-25',25,'深川・旭川・比布',372,111],['main-26',26,'士別・名寄・美深・音威子府',370,74],['main-27',27,'中川・幌延・豊富',357,59],['main-28',28,'総集編（ゴール：宗谷岬）',361,42]].map(a=>({id:a[0],o:a[1],a:a[2],px:a[3],py:a[4],l:1}));const DU=[{id:'doll-01',n:1,a:'大阪（大阪歴史博物館）',c:'人形交流',q:'青い目の人形「メリー」の贈り主は？',x:['アメリカの子どもたち','アメリカ政府','商館','赤十字'],z:0,e:'ギューリックの呼びかけで全米の子どもたちから集まりました。',px:199,py:455},{id:'doll-02',n:2,a:'大津（大津市歴史博物館）',c:'人形交流',q:'青い目の人形たちは1941年の開戦後どうなった？',x:['国外へ送られた','博物館に保管された','敵国の人形として多くが壊された','防空壕に隠された'],z:2,e:'開戦後、敵国からの人形として多くが壊されました。',px:214,py:435}];const DF=[{id:'doll-03',n:3,a:'白山（白山市立博物館）',px:236,py:406,l:1},{id:'doll-04',n:4,a:'札幌（札幌市時計台・簾舞小学校）',px:333,py:125,l:1},{id:'doll-05',n:5,a:'美唄（美唄市郷土史料館）',px:356,py:120,l:1}];const A=[...U,...F],AD=[...DU,...DF],K='ride-quiz-progress-v1';let P=JSON.parse(localStorage.getItem(K)||'{}'),C=U.at(-1);const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function tab(id){$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p==id));$$('.panel').forEach(p=>p.classList.toggle('on',p.id==id));if(id=='map')map();if(id=='doll')dolls()}function render(q){C=q;$('#no').textContent=q.o?'第'+q.o+'問':'人形ボーナス '+q.n;$('#area').textContent=q.a;$('#cat').textContent=q.c;$('#q').textContent=q.q;$('#choices').innerHTML='';q.x.forEach((v,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+i)+'　'+v;b.onclick=()=>ans(i,b);$('#choices').append(b)});$('#fb').className='fb';score();tab('quiz')}function ans(i,b){$$('.choice').forEach(x=>x.disabled=1);$('#ex').textContent=C.e;$('#fb').className='fb show';if(i==C.z){b.classList.add('ok');P[C.id]=1;localStorage.setItem(K,JSON.stringify(P));$('#ft').textContent='せいかい！';for(let j=0;j<50;j++){let c=document.createElement('i');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.background=['#e84855','#ffd447','#276fbf','#35a853'][j%4];document.body.append(c);setTimeout(()=>c.remove(),2200)}}else{b.classList.add('ng');$('#ft').textContent='ざんねん！'}score()}function score(){let T=[...U,...DU],n=T.filter(q=>P[q.id]).length;$('#score').textContent='正解済み '+n+'／解放済み '+T.length;$('#fill').style.width=(n/T.length*100)+'%'}function dolls(){let l=$('#dolllist');l.innerHTML='';AD.forEach(s=>{let b=document.createElement('button');b.className='item '+(s.l?'locked':'');b.textContent=(s.l?'🔒 ':'🪆 ')+s.a+(P[s.id]?'　✓':'');b.onclick=()=>s.l?0:render(DU.find(q=>q.id==s.id));l.append(b)})}function map(){let rp=A.map(s=>s.px+','+s.py).join('L');$('#r').setAttribute('d','M'+rp);$('#d').setAttribute('d','M'+rp);$('#nodes').innerHTML='';$('#mlist').innerHTML='';A.forEach(s=>{if(!s.l){let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','node');g.setAttribute('transform','translate('+s.px+' '+s.py+')');g.innerHTML='<circle r="13"/><text y="1">'+(P[s.id]?'✓':s.o)+'</text>';g.onclick=()=>render(U.find(q=>q.id==s.id));$('#nodes').append(g)}let b=document.createElement('button');b.className='item '+(s.l?'locked':'');b.textContent=(s.l?'🔒 ':'● ')+s.o+' '+s.a;b.onclick=()=>s.l?0:render(U.find(q=>q.id==s.id));$('#mlist').append(b)});let q=U.at(-1);$('#bike').setAttribute('transform','translate('+q.px+' '+(q.py-25)+')')}$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.p));$('#retry').onclick=()=>render(C);$('#mapbtn').onclick=()=>tab('map');$('#portal').onclick=()=>{if(window.self!==window.top) return; history.length>1?history.back():location.href='https://pzeo581e-max.github.io/2026summer/'};render(C);map();dolls();</script></body></html>
