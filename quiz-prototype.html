ータルへ戻る</button><p>未来の問題は地域名だけの鍵付き表示です。回答記録は同じ端末・ブラウザ内に保存されます。</p></section><section id="doll" class="panel"><h2>🪆 人形ボーナス</h2><div id="dolllist" class="list"></div></section><section id="map" class="panel"><div class="mapgrid"><svg viewBox="0 0 520 620" role="img" aria-label="日本縦断クイズ地図"><path class="land" d="M88 609L104 600 122 594 114 573 122 547 130 532 127 524 124 504 120 512 96 495 78 502 65 514 51 517 57 527 62 541 77 539 78 556 79 562 77 598Z"/><path class="land" d="M168 489L160 498 157 533 169 542 186 509 208 521 220 489 203 478 195 480Z"/><path class="land" d="M98 493L110 488 127 482 169 434 209 434 224 424 237 413 255 408 273 411 291 392 299 386 312 355 317 368 309 386 332 373 372 339 386 327 399 303 396 290 394 283 404 272 408 269 406 249 402 232 406 209 429 226 442 224 445 198 454 203 455 238 469 250 471 272 469 293 448 319 439 323 437 373 420 399 433 425 400 453 400 437 404 429 393 443 385 449 377 452 368 465 358 466 344 468 328 464 302 464 307 470 298 479 261 514 240 483 247 468 242 465 225 460 199 466 179 473 174 476 156 478 140 485 118 490 109 494Z"/><path class="land" d="M434 204L419 198 407 182 398 165 390 148 385 130 380 110 384 92 393 76 406 62 424 50 445 42 463 36 469 40 478 48 491 58 507 68 520 82 528 98 517 112 510 124 517 136 504 148 491 158 478 168 465 180 452 190Z"/><path id="r" class="route"/><path id="d" class="dash"/><g id="nodes"></g><g id="bike"><circle r="14" fill="#fff" stroke="#183059" stroke-width="3"/><text y="6" text-anchor="middle" font-size="18">🚲</text></g></svg><div id="mlist" class="list"></div></div></section></section></main><script>const U=[['main-01',1,'佐多岬・大隅半島','地理','佐多岬は、次のうちどの「最南端」でしょう？',['日本列島全体の最南端','日本本土の最南端','鹿児島県の有人島最南端','西日本の最東端'],1,'佐多岬は日本本土最南端です。',91,604],['main-02',2,'鹿屋・日南・青島・宮崎','観光・自然','宮崎・青島の奇岩群「鬼の洗濯板」はどうできた？',['川の土砂が固まった','溶岩が削られた','地層が隆起し波で硬い岩だけ残った','人工の防波堤跡'],2,'隆起した地層が波に削られてできました。',114,573],['main-03',3,'宮崎・延岡・宗太郎・佐伯','地理','大分県佐伯市の面積の特徴は？',['九州の市の中で最も広い','九州で唯一海に面していない','九州最小','人口密度が最も高い'],0,'佐伯市は九州の市町村で最大級の面積です。',131,534],['main-04',4,'佐伯・大分・別府・行橋','観光・自然','別府温泉が日本一を誇る組み合わせは？',['泉質と宿数','源泉数と湧出量','露天風呂と客数','歴史と湯温'],1,'別府温泉は源泉数・湧出量ともに日本一です。',116,515],['main-05',5,'行橋・北九州・門司・関門海峡・下関','産業・交通','自転車で関門トンネル人道を通る方法は？',['そのまま走る','押して歩く','輪行袋に入れる','通行できない'],1,'自転車は押して歩けば通行できます。',98,493],['main-06',6,'光市内','歴史','光市出身の初代内閣総理大臣は？',['大久保利通','伊藤博文','山縣有朋','井上馨'],1,'伊藤博文は現在の光市束荷で生まれました。',131,492],['main-07',7,'光・岩国・広島・尾道','歴史','原爆ドームはもともと何の施設？',['広島県物産陳列館','広島県庁舎','広島駅','市民病院'],0,'もとは広島県物産陳列館でした。',150,476],['main-08',8,'尾道・福山・倉敷・岡山','歴史','倉敷は江戸時代どんな地として栄えた？',['宿場町','鉱山町','幕府直轄の物資集散地','城下町'],2,'倉敷は天領として物資の集積地になりました。',199,466],['main-09',9,'岡山・姫路・明石・神戸','名産・グルメ','明石焼きの特徴的な食べ方は？',['だし汁につける','ソースをかける','しょうゆと七味','塩をふる'],0,'明石焼きはだし汁につけて食べます。',238,470],['main-10',10,'神戸市内','歴史','神戸ルミナリエが始まったきっかけは？',['開港記念','震災犠牲者への鎮魂と復興への願い','観光誘致','姉妹都市記念'],1,'阪神・淡路大震災の鎮魂と復興への願いが込められています。',241,446],['main-11',11,'神戸・京都・大津・湖西','地理','琵琶湖は大きさ以外の点でも日本一です。それは？',['最も深い','最も古い湖（古代湖）','透明度が最も高い','標高が最も高い'],1,'琵琶湖はおよそ400万年の歴史を持つ日本最古の湖です。',265,441],['main-12',12,'真野・敦賀・鯖江・福井','産業・交通','福井県鯖江市で日本の9割以上を生産する製品は？',['包丁','陶器','家具','メガネ'],3,'鯖江市は日本のメガネフレーム生産の9割以上を占めます。',276,410],['main-13',13,'福井・加賀・金沢','観光・自然','兼六園の「兼六」が示すものは？',['門の数','池の数','景観の要素（六勝）','茶室の数'],2,'宏大・幽邃・人力・蒼古・水泉・眺望の六勝です。',290,391],['main-14',14,'金沢・富山・浜黒崎・糸魚川','歴史','雨晴海岸の地名由来となった人物は？',['源義経','松尾芭蕉','武田信玄','徳川家康'],0,'源義経が雨宿りしたという伝説に由来します。',332,373],['main-15',15,'能生・長岡・和島・新潟','歴史','長岡復興祭が1946年に開かれた理由は？',['貿易再開','空襲犠牲者への慰霊と復興への願い','県誕生','上杉謙信顕彰'],1,'長岡空襲の犠牲者への慰霊と復興への願いから始まりました。',369,341],['main-16',16,'新潟・新発田・胎内・村上','地理','信濃川は長野県内で何と呼ばれる？',['犀川','姫川','千曲川','魚野川'],2,'長野県内では千曲川と呼ばれます。',388,326],['main-17',17,'鶴岡・酒田・象潟','地理','象潟に現在田んぼが広がる理由は？',['大地震で海底が隆起した','干拓','土砂','排水'],0,'1804年の象潟地震で海底が隆起しました。',400,306],['main-18',18,'由利本荘・秋田・潟上','その他','秋田竿燈まつりの「竿燈」は何に見立てたもの？',['夜空の星','船の帆柱','実りの稲穂','武者の旗指物'],2,'竿燈は全体を稲穂、提灯を米俵に見立て、五穀豊穣を願います。',408,269],['main-19',19,'能代・八峰・深浦（白神山地西麓）','観光・自然','白神山地の原生林を構成する木は？',['スギ','ブナ','ヒノキ','トドマツ'],1,'白神山地には東アジア最大級の原生的なブナ林が残ります。',
